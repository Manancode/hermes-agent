name: hermes-health
version: 0.1.0
description: "Pipeline health observer — tracks LLM calls, tool execution, memory sync, and computer-use across the Hermes → TencentDB → HCNSC stack."
author: "opencode"
kind: backend
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_finalize
  - subagent_start
  - subagent_stop
